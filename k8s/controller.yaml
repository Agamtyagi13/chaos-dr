apiVersion: v1
kind: ServiceAccount
metadata: {name: chaos-controller, namespace: chaos-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: chaos-controller}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, secrets, events]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets]
    verbs: [get, list, patch]
  - apiGroups: [chaos-mesh.org]
    resources: ["*"]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: chaos-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: chaos-controller}
subjects: [{kind: ServiceAccount, name: chaos-controller, namespace: chaos-demo}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: chaos-campaign, namespace: chaos-demo}
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: chaos-controller
      restartPolicy: Never
      containers:
        - name: controller
          image: chaos-dr:latest        # docker build -t chaos-dr:latest .
          args: ["run", "--backend", "k8s", "--namespace", "chaos-demo",
                 "--target-url", "http://api.chaos-demo.svc/healthz", "--out", "/reports"]
          volumeMounts: [{name: reports, mountPath: /reports}]
      volumes: [{name: reports, emptyDir: {}}]
